        }

        // ============================================
        // Generic resources & CRDs
        // ============================================
        // Rows of the last generic list; onclick handlers reference them by
        // index so untrusted names never get interpolated into JS strings.
        let _genericRows = [];
        let _genericKind = null;
        let _lastCRDetail = null;

        function genericEdit(i) {
            const r = _genericRows[i];
            if (r) editResourceYaml(_genericKind, r.namespace || null, r.name);
        }

        function genericOpenCRD(i) {
            const r = _genericRows[i];
            if (r) navigate('customresources', { crKind: r.crKind, kind: r.kind, group: r.group, version: r.version, scope: r.scope, name: r.name });
        }

        async function renderGenericResources(kind, opts = {}) {
            const view = currentView;
            const meta = GENERIC_VIEWS[kind] || {};
            const title = opts.title || meta.name || kind;
            const namespaced = opts.namespaced ?? meta.namespaced;
            const isCRD = kind === 'customresourcedefinitions';
            const content = document.getElementById('content');
            content.innerHTML = skeletonTable(6, 8);
            try {
                const res = await fetch(`${getClusterAPI()}/resources/${encodeURIComponent(kind)}${namespaced ? getNamespaceParam() : ''}`);
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    const e = new Error(data.error || `HTTP ${res.status}`);
                    e.status = res.status; e.details = data.details;
                    throw e;
                }
                if (currentView !== view) return; // user navigated away meanwhile
                const items = getItems(data);
                _genericRows = items;
                _genericKind = kind;
                items.forEach((r, i) => { r._i = i; });
                const serverCols = data.columns || [];
                const nameIdx = serverCols.indexOf('Name');
                const cols = [{
                    label: 'Name',
                    render: r => `<span class="cell-name cursor-pointer hover:underline hover:text-k8s-blue" onclick="${isCRD ? 'genericOpenCRD' : 'genericEdit'}(${r._i})">${escapeHtml(r.name)}</span>`
                }];
                if (namespaced) cols.push({ label: 'Namespace', class: 'cell-namespace', render: r => escapeHtml(r.namespace || '-') });
                if (isCRD) ['group', 'version', 'kind', 'scope'].forEach(k =>
                    cols.push({ label: k.charAt(0).toUpperCase() + k.slice(1), render: r => escapeHtml(r[k] ?? '-') }));
                serverCols.forEach((c, i) => {
                    if (i === nameIdx) return;
                    cols.push({ label: escapeHtml(c), render: r => { const v = (r.cells || [])[i]; return v === null || v === undefined || v === '' ? '-' : escapeHtml(String(v)); } });
                });
                content.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <h1 class="text-xl font-bold">${escapeHtml(title)}</h1>
                        <span class="text-sm text-slate-400">${items.length} total</span>
                    </div>
                    <div class="bg-slate-800 rounded-lg border border-slate-700">
                        ${renderTable(cols, items, r => `<button onclick="genericEdit(${r._i})" class="text-green-400 hover:text-green-300" title="Edit YAML"><i class="fas fa-edit"></i></button>`)}
                    </div>
                `;
            } catch (err) {
                if (currentView !== view) return;
                let html = renderErrorState(view, err.message);
                if (err.status) {
                    const label = err.status === 403 ? 'Forbidden — the dashboard service account lacks RBAC permission for this resource.' : `Server returned ${err.status}.`;
                    html += `<div class="mt-4 mx-auto max-w-2xl px-3 py-2 rounded text-sm bg-red-900/40 border border-red-700 text-red-200 whitespace-pre-wrap mono">${escapeHtml(label)}\n${escapeHtml(err.message)}${err.details ? '\n' + escapeHtml(err.details) : ''}</div>`;
                }
                content.innerHTML = html;
            }
        }

        function renderCustomResources(detail) {
            detail = detail || _lastCRDetail;
            if (!detail || !detail.crKind) { navigate('customresourcedefinitions'); return; }
            _lastCRDetail = detail;
            const label = detail.kind || detail.name;
            document.getElementById('breadcrumb-content').innerHTML =
                `<span class="breadcrumb-category">Custom Resources</span><span class="breadcrumb-separator">›</span>` +
                `<a href="#" onclick="navigate('customresourcedefinitions')">CRDs</a><span class="breadcrumb-separator">›</span>` +
                `<span class="breadcrumb-current">${escapeHtml(label)}</span>`;
            renderGenericResources(detail.crKind, { title: label, namespaced: detail.scope === 'Namespaced' });
        }

        // ============================================
        // Helm releases
        // ============================================
        // JS args for inline onclick="fn(...)": JSON literals, HTML-attribute-escaped so quotes can't break out.
        const helmArgs = (...a) => a.map(v => JSON.stringify(v)).join(', ').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        const helmStatusClass = s => s === 'deployed' ? 'text-green-400' : s === 'failed' ? 'text-red-400'
            : String(s || '').startsWith('pending') ? 'text-yellow-400' : 'text-slate-400';
        function helmAge(ts) {
            const sec = (Date.now() - new Date(ts)) / 1000;
            if (!ts || isNaN(sec)) return '-';
            if (sec < 60) return `${Math.max(0, Math.floor(sec))}s`;
            if (sec < 3600) return `${Math.floor(sec / 60)}m`;
            if (sec < 86400) return `${Math.floor(sec / 3600)}h`;
            return `${Math.floor(sec / 86400)}d`;
        }

        async function renderHelmReleases() {
            const content = document.getElementById('content');
            content.innerHTML = skeletonTable(6, 8);
            try {
                const items = getItems(await fetchAPI(`${getClusterAPI()}/helm/releases${getNamespaceParam()}`));
                content.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <h1 class="text-xl font-bold">Helm Releases</h1>
                        <span class="text-sm text-slate-400">${items.length} total</span>
                    </div>
                    <div class="bg-slate-800 rounded-lg border border-slate-700">
                        ${renderTable([
                    { label: 'Name', key: 'name', render: r => `<span class="cell-name cursor-pointer hover:underline hover:text-k8s-blue" onclick="showHelmRelease(${helmArgs(r.namespace, r.name)})">${escapeHtml(r.name)}</span>` },
                    { label: 'Namespace', key: 'namespace', class: 'cell-namespace', render: r => escapeHtml(r.namespace) },
                    { label: 'Revision', key: 'revision' },
                    { label: 'Status', key: 'status', render: r => `<span class="${helmStatusClass(r.status)}">${escapeHtml(r.status || '-')}</span>` },
                    { label: 'Chart', key: 'chart', render: r => escapeHtml(r.chart || '-') },
                    { label: 'App Version', key: 'appVersion', render: r => escapeHtml(r.appVersion || '-') },
                    { label: 'Updated', key: 'updated', class: 'text-slate-400', render: r => `<span title="${escapeHtml(r.updated || '')}">${helmAge(r.updated)}</span>` }
                ], items, r => `
                    ${r.revision > 1 ? `<button onclick="rollbackHelmRelease(${helmArgs(r.namespace, r.name, 0)}, this)" class="px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded text-xs mr-1" title="Rollback to previous revision"><i class="fas fa-undo"></i></button>` : ''}
                    <button onclick="uninstallHelmRelease(${helmArgs(r.namespace, r.name)}, this)" class="px-2 py-1 bg-red-600 hover:bg-red-500 rounded text-xs" title="Uninstall"><i class="fas fa-trash"></i></button>
                `)}
                    </div>
                `;
            } catch (err) {
                content.innerHTML = renderErrorState(currentView, err.message);
            }
        }

        async function showHelmRelease(namespace, name) {
            try {
                const d = await fetchAPI(`${getClusterAPI()}/helm/releases/${encodeURIComponent(namespace)}/${encodeURIComponent(name)}`);
                const e = v => escapeHtml(v == null || v === '' ? '-' : String(v));
                const pre = text => `<pre class="code-block mono text-xs overflow-auto max-h-96 p-2 rounded mt-2 whitespace-pre">${escapeHtml(text || '')}</pre>`;
                const section = (title, text) => text ? `
                    <details class="bg-slate-700 rounded p-4">
                        <summary class="text-sm font-semibold text-k8s-blue cursor-pointer"><i class="fas fa-file-code mr-2"></i>${title}</summary>
                        ${pre(text)}
                    </details>` : '';
                document.getElementById('modal-title').textContent = `Helm Release: ${namespace}/${name}`;
                document.getElementById('modal-content').innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-slate-700 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-3">Summary</h3>
                            <div class="grid grid-cols-2 gap-3 text-sm">
                                <div><span class="text-slate-400">Status:</span> <span class="${helmStatusClass(d.status)}">${e(d.status)}</span></div>
                                <div><span class="text-slate-400">Revision:</span> ${e(d.revision)}</div>
                                <div><span class="text-slate-400">Chart:</span> ${e(d.chart)}</div>
                                <div><span class="text-slate-400">App Version:</span> ${e(d.appVersion)}</div>
                                <div><span class="text-slate-400">First Deployed:</span> ${e(d.firstDeployed)}</div>
                                <div><span class="text-slate-400">Last Updated:</span> ${e(d.updated)}</div>
                                <div class="col-span-2"><span class="text-slate-400">Description:</span> ${e(d.description)}</div>
                            </div>
                        </div>
                        ${d.notes ? `
                        <div class="bg-slate-700 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue">Notes</h3>
                            ${pre(d.notes)}
                        </div>` : ''}
                        <div class="bg-slate-700 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-3">History</h3>
                            <table class="w-full text-sm">
                                <thead class="text-slate-400 text-left"><tr><th class="py-1">Rev</th><th>Status</th><th>Chart</th><th>App</th><th>Updated</th><th>Description</th><th></th></tr></thead>
                                <tbody class="divide-y divide-slate-600">
                                    ${(d.history || []).map(h => `
                                        <tr>
                                            <td class="py-1">${e(h.revision)}</td>
                                            <td class="${helmStatusClass(h.status)}">${e(h.status)}</td>
                                            <td>${e(h.chart)}</td>
                                            <td>${e(h.appVersion)}</td>
                                            <td class="text-slate-400" title="${e(h.updated)}">${helmAge(h.updated)}</td>
                                            <td class="text-slate-300">${e(h.description)}</td>
                                            <td class="text-right">${h.revision !== d.revision ? `<button onclick="rollbackHelmRelease(${helmArgs(namespace, name, Number(h.revision))}, this)" class="px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded text-xs whitespace-nowrap"><i class="fas fa-undo mr-1"></i>Rollback to r${e(h.revision)}</button>` : ''}</td>
                                        </tr>`).join('') || '<tr><td colspan="7" class="text-slate-400 py-1">No history</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                        ${section('User Values', d.userValues)}
                        ${section('All Values (computed)', d.allValues)}
                        ${section('Manifest', d.manifest)}
                    </div>
                `;
                document.getElementById('detail-modal').classList.remove('hidden');
            } catch (err) {
                toast('Error: ' + err.message);
            }
        }

        // Shared runner for helm mutations: disables the clicked button with a spinner while the request runs.
        async function helmMutate(url, opts, btn, okMsg) {
            const orig = btn?.innerHTML;
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; }
            try {
                const res = await fetch(url, opts);
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { toast(data.details || data.error || `HTTP ${res.status}`, 'error'); return; }
                toast(data.message || okMsg, 'success');
                closeModal();
                refreshCurrentView();
            } catch (err) {
                toast('Error: ' + err.message, 'error');
            } finally {
                if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = orig; }
            }
        }

        async function rollbackHelmRelease(namespace, name, revision, btn) {
            const target = revision ? `revision ${revision}` : 'the previous revision';
            if (!await uiConfirm('Rollback release', `Roll back Helm release "${name}" in namespace "${namespace}" to ${target}?`, { okText: 'Rollback' })) return;
            toast(`Rolling back ${name}… this can take a while`, 'info');
            await helmMutate(`${getClusterAPI()}/helm/releases/${encodeURIComponent(namespace)}/${encodeURIComponent(name)}/rollback`,
                { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ revision: Number(revision) || 0 }) },
                btn, `Rolled back ${name}`);
        }

        async function uninstallHelmRelease(namespace, name, btn) {
            if (!await uiConfirm('Uninstall release', `Uninstall Helm release "${name}" in namespace "${namespace}"? This deletes ALL Kubernetes resources created by the release and cannot be undone.`, { okText: 'Uninstall', danger: true })) return;
            await helmMutate(`${getClusterAPI()}/helm/releases/${encodeURIComponent(namespace)}/${encodeURIComponent(name)}`, { method: 'DELETE' }, btn, `Uninstalled ${name}`);
        }

        // Utilities
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }

        // In-page replacements for window.confirm / prompt / alert.
        function uiDialog(title, message, { okText = 'Confirm', danger = false, input = null } = {}) {
            const dlg = document.getElementById('ui-dialog');
            const inp = document.getElementById('ui-dialog-input');
            const ok = document.getElementById('ui-dialog-ok');
            document.getElementById('ui-dialog-title').textContent = title;
            document.getElementById('ui-dialog-message').textContent = message;
            ok.textContent = okText;
            ok.className = `px-4 py-2 rounded text-sm ${danger ? 'bg-red-600 hover:bg-red-500' : 'bg-k8s-blue hover:opacity-90'}`;
            inp.classList.toggle('hidden', !input);
            if (input) Object.assign(inp, { type: 'text', min: '', step: '', required: false, value: '' }, input);
            dlg.returnValue = '';
            dlg.showModal();
            (input ? inp : ok).focus();
            if (input) inp.select();
            return new Promise(resolve => dlg.addEventListener('close', () => {
                const confirmed = dlg.returnValue === 'ok';
                resolve(input ? (confirmed ? inp.value : null) : confirmed);
            }, { once: true }));
        }
        const uiConfirm = (title, message, opts) => uiDialog(title, message, opts);
        const uiPrompt = (title, message, input, opts) => uiDialog(title, message, { okText: 'OK', ...opts, input });
        async function uiPromptReplicas(kind, namespace, name) {
            // Pre-fill with the current desired replicas (spec.replicas; unset means 1).
            let current = 1;
            try {
                const obj = await fetchAPI(`${getClusterAPI()}/${kind}s/${namespace}/${name}`);
                current = obj.spec?.replicas ?? 1;
            } catch (_) { /* fall back to 1; the dialog still works */ }
            const v = await uiPrompt(`Scale ${kind}`, `Scale ${kind} "${name}" to how many replicas? (currently ${current})`,
                { type: 'number', min: '0', step: '1', required: true, value: String(current) }, { okText: 'Scale' });
            return v === null ? null : parseInt(v, 10);
        }
        // Keep Esc inside the dialog from also closing the drawer/palette underneath.
        document.getElementById('ui-dialog').addEventListener('keydown', e => { if (e.key === 'Escape') e.stopPropagation(); });

        function toast(message, type = 'error') {
            const el = document.createElement('div');
            el.className = `max-w-sm px-4 py-3 rounded shadow-lg text-sm text-slate-50 whitespace-pre-wrap ${type === 'error' ? 'bg-red-700' : type === 'success' ? 'bg-green-700' : 'bg-slate-700'}`;
            el.textContent = message;
            el.onclick = () => el.remove();
            document.getElementById('ui-toasts').appendChild(el);
            setTimeout(() => el.remove(), 5000);
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
            if (window._yamlEditor) {
                try { window._yamlEditor.destroy(); } catch (_) {}
                window._yamlEditor = null;
            }
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Close modal on backdrop click
        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') closeModal();
        });

        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');

            if (body.classList.contains('light')) {
                body.classList.remove('light');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.add('light');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        }

        // Load saved theme on page load
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light');
                const icon = document.getElementById('theme-icon');
                if (icon) {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
            }
        })();
    </script>

                    Cancel
                </button>
                <button id="preview-btn" onclick="previewKubeconfig()" disabled class="px-4 py-2 bg-slate-600 hover:bg-slate-500 text-white text-sm rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Preview
                </button>
                <button id="import-btn" onclick="importKubeconfig()" class="px-4 py-2 bg-k8s-blue hover:bg-blue-600 text-white text-sm rounded transition-colors hidden">
                    Import
                </button>
                <button id="done-btn" onclick="closeImportModal()" class="px-4 py-2 bg-green-600 hover:bg-green-500 text-white text-sm rounded transition-colors hidden">
                    Done
                </button>
            </div>
        </div>
    </div>
</body>

</html>
