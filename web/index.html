<!DOCTYPE html>
<html lang="en" class="dark">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="bg-slate-900 text-slate-200 min-h-screen">

                    <path d="M16 6l-8 4v8l8 4 8-4v-8l-8-4z" fill="#fff" />

            <!-- Cluster Selector -->
            <div class="p-3 border-b border-slate-700">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-server text-k8s-blue"></i>
                        <span>Cluster</span>
                    </div>
                    <button onclick="openImportModal()" class="text-k8s-blue hover:text-blue-400 transition-colors" title="Import Kubeconfig">
                        <i class="fas fa-plus-circle"></i>
                    </button>
                </div>

                    class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-k8s-blue">
                    <option value="">Loading clusters...</option>
                </select>
                <div id="cluster-indicator" class="mt-2 text-xs text-slate-400">
                    <span id="cluster-count">0</span> clusters connected
                </div>
            </div>

            <!-- Namespace Selector -->
            <div class="p-3 border-b border-slate-700">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i class="fas fa-folder text-yellow-500"></i>
                    <span>Current Namespace</span>
                </div>
                <select id="namespace-select" onchange="changeNamespace(this.value)"
                    class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-k8s-blue">
                    <option value="">All namespaces</option>

                    <span id="ns-count">0</span> namespaces available

        <!-- Main Content -->

    <!-- Detail Drawer (slides in from right) -->
    <div id="detail-modal" class="fixed inset-0 hidden z-50">
        <div class="bg-slate-800 shadow-xl overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b border-slate-700">

                <button onclick="closeModal()" class="p-2 hover:bg-slate-700 rounded" title="Close (Esc)">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-content" class="p-4">
            </div>
        </div>
    </div>

    <!-- In-page confirm/prompt dialog (replaces window.confirm/prompt) -->
    <dialog id="ui-dialog" class="m-auto bg-slate-800 text-white rounded-lg border border-slate-700 w-full max-w-md shadow-2xl p-0 backdrop:bg-black/50">
        <form method="dialog">
            <div class="p-4 border-b border-slate-700">
                <h2 id="ui-dialog-title" class="text-lg font-semibold"></h2>
            </div>
            <div class="p-4 space-y-3">
                <p id="ui-dialog-message" class="text-sm text-slate-300 whitespace-pre-wrap"></p>
                <input id="ui-dialog-input" class="hidden w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-k8s-blue">
            </div>
            <!-- OK first in DOM so Enter submits OK; row-reverse puts it on the right -->
            <div class="px-4 py-3 border-t border-slate-700 flex flex-row-reverse gap-2">
                <button id="ui-dialog-ok" value="ok" class="px-4 py-2 rounded text-sm"></button>
                <button value="cancel" formnovalidate class="px-4 py-2 bg-slate-600 hover:bg-slate-500 rounded text-sm">Cancel</button>
            </div>
        </form>
    </dialog>
    <div id="ui-toasts" class="fixed bottom-4 right-4 z-[70] flex flex-col gap-2"></div>

    <!-- Command Palette (Cmd/Ctrl+K) -->
    <div id="command-palette" class="fixed inset-0 hidden z-[60] flex items-start justify-center pt-24">
        <div class="palette-panel" onclick="event.stopPropagation()">
            <div class="flex items-center px-3 border-b border-slate-700">
                <i class="fas fa-globe text-slate-400 mr-2" data-palette-search-icon></i>
                <input id="palette-input" type="text" placeholder="Search resources, namespaces, clusters..." autocomplete="off" />
                <kbd class="mr-2">esc</kbd>
            </div>
            <div id="palette-list" class="palette-list"></div>
        </div>
    </div>

        let currentNamespace = '';
        let currentView = 'overview';
        let eventSource = null;
        let refreshInterval = null;
        let currentCluster = '';

        // ============================================
        // Lucide icon swap (replaces Font Awesome at runtime)
        // ============================================

            'fa-globe': 'globe', 'fa-hdd': 'hard-drive', 'fa-inbox': 'inbox',
            'fa-key': 'key', 'fa-layer-group': 'layers', 'fa-link': 'link',

        function swapFaIcons(root) {
            if (!window.lucide) return;
            const scope = root || document;
            const els = scope.querySelectorAll('i.fas, i.far, i.fab, i.fa');
            els.forEach(el => {
                const faName = Array.from(el.classList).find(c => c.startsWith('fa-') && !['fa-spin','fa-2x','fa-3x','fa-4x','fa-fw'].includes(c));
                const name = FA_TO_LUCIDE[faName] || 'square';
                const preserved = Array.from(el.classList).filter(c => !c.startsWith('fa') && c !== 'fa');
                if (el.classList.contains('fa-spin')) preserved.push('animate-spin');
                if (el.classList.contains('fa-3x')) preserved.push('text-4xl');
                else if (el.classList.contains('fa-2x')) preserved.push('text-2xl');
                el.removeAttribute('class');
                preserved.forEach(c => el.classList.add(c));
                el.setAttribute('data-lucide', name);
            });
            // Only run createIcons when there are <i data-lucide> elements
            // pending. Lucide itself selects `[data-lucide]`, which also
            // matches the SVGs it just produced (they keep the attribute);
            // calling it unconditionally turns the MutationObserver below
            // into an infinite icon-replace loop, which destroys click
            // targets every animation frame and breaks action-column
            // buttons.
            if (scope.querySelector('i[data-lucide]')) {
                window.lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
            }
        }

        let _iconSwapPending = false;
        function scheduleIconSwap() {
            if (_iconSwapPending) return;
            _iconSwapPending = true;
            requestAnimationFrame(() => {
                _iconSwapPending = false;
                swapFaIcons();
            });
        }
        new MutationObserver(scheduleIconSwap).observe(document.body, { childList: true, subtree: true });

        // Initial swap (MutationObserver only catches future changes)
        function _initialIconSwap() {
            if (window.lucide) { swapFaIcons(); return; }
            setTimeout(_initialIconSwap, 30);
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', _initialIconSwap);
        } else {
            _initialIconSwap();
        }

            ).join('');
            const body = Array(rows).fill(0).map(() =>
                `<tr class="border-t border-slate-700/40"><td colspan="${cols}" class="px-4 py-3"><span class="skeleton block" style="height:0.85rem;width:${60 + Math.random() * 35}%">x</span></td></tr>`
            ).join('');
            return `<div class="bg-slate-800 rounded-lg border border-slate-700"><div class="table-container"><table class="w-full"><thead class="table-header"><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;

        function paletteCandidates() {
            const items = [...PALETTE_NAV];
            (window._availableClusters || []).forEach(c => items.push({ kind: 'cluster', label: c, icon: 'server', cluster: c }));
            (window._availableNamespaces || []).forEach(n => items.push({ kind: 'namespace', label: n, icon: 'folder', namespace: n }));

        function renderPalette(query) {
            const list = document.getElementById('palette-list');
            const q = (query || '').toLowerCase().trim();
            const all = paletteCandidates();
            paletteFiltered = q ? all.filter(it => it.label.toLowerCase().includes(q)) : all;
            paletteActiveIdx = 0;
            if (!paletteFiltered.length) {
                list.innerHTML = `<div class="palette-item" style="cursor:default;color:#64748b">No matches</div>`;
                return;
            }
            list.innerHTML = paletteFiltered.slice(0, 50).map((it, i) => `

        function movePalette(delta) {

            if (!items.length) return;
            paletteActiveIdx = (paletteActiveIdx + delta + items.length) % items.length;
            items.forEach(el => el.classList.remove('active'));
            items[paletteActiveIdx].classList.add('active');
            items[paletteActiveIdx].scrollIntoView({ block: 'nearest' });
        }

        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');
            const dropLabel = document.getElementById('drop-label');

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropLabel.classList.add('border-k8s-blue', 'bg-slate-600/50');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropLabel.classList.remove('border-k8s-blue', 'bg-slate-600/50');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            }, false);
        }

        async function importKubeconfig() {
            if (!kubeconfigContent) return;

            // Build name mappings from custom names
            const nameMapping = {};
            if (window.kubeconfigContexts) {
                window.kubeconfigContexts.forEach(ctx => {
                    if (ctx.customName && ctx.customName !== ctx.original) {
                        nameMapping[ctx.original] = ctx.customName;
                    }
                });
            }

            try {
                const res = await fetch(`${API_BASE}/api/kubeconfig/upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: kubeconfigContent,
                        nameMapping: nameMapping
                    })
                });
                const data = await res.json();

                if (!res.ok) {
                    document.getElementById('import-result').innerHTML = `<span class="text-red-400">${data.error}</span>`;
                    document.getElementById('import-result').classList.remove('hidden', 'bg-green-900/30');
                    document.getElementById('import-result').classList.add('bg-red-900/30');
                    return;
                }

                const added = data.addedClusters || [];
                const failed = data.failedClusters || [];

                let msg = '';
                if (added.length > 0) {
                    msg += `<span class="text-green-400"><i class="fas fa-check mr-1"></i>Added: ${added.join(', ')}</span>`;
                }
                if (failed.length > 0) {
                    msg += `<br><span class="text-red-400"><i class="fas fa-times mr-1"></i>Failed: ${failed.join(', ')}</span>`;
                }
                if (added.length === 0 && failed.length === 0) {
                    msg = '<span class="text-yellow-400">No new clusters to import</span>';
                }

                document.getElementById('import-result').innerHTML = msg;
                document.getElementById('import-result').classList.remove('hidden', 'bg-red-900/30');
                document.getElementById('import-result').classList.add('bg-green-900/30');
                document.getElementById('import-btn').classList.add('hidden');

                // Show Done button, hide Cancel after successful import

                    document.getElementById('cancel-btn').classList.add('hidden');
                    document.getElementById('preview-btn').classList.add('hidden');
                    document.getElementById('done-btn').classList.remove('hidden');

                    // Set the newly added cluster as current and refresh
                    currentCluster = added[0];
                }

                // Refresh clusters list and namespaces
                await loadClusters();
                if (currentCluster) {
                    document.getElementById('cluster-select').value = currentCluster;
                    await loadNamespaces();
                }

                document.getElementById('import-result').innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;

            if (!currentCluster) {
                console.log('No cluster selected, skipping namespace load');
                return;
            }
            try {
                const res = await fetch(`${getClusterAPI()}/namespaces`);
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                const data = await res.json();
                const sidebarSelect = document.getElementById('namespace-select');

                sidebarSelect.innerHTML = '<option value="">All namespaces</option>';

                // Sort namespaces alphabetically and add to dropdown
                const namespaces = data.items || [];
                namespaces.sort((a, b) => a.name.localeCompare(b.name));
                namespaces.forEach(ns => {
                    sidebarSelect.innerHTML += `<option value="${ns.name}">${ns.name}</option>`;
                });

                // Update namespace count
                document.getElementById('ns-count').textContent = namespaces.length;
                window._availableNamespaces = namespaces.map(n => n.name);

                // Restore current selection if any
                if (currentNamespace) {
                    sidebarSelect.value = currentNamespace;
                }
            } catch (err) {
                console.error('Failed to load namespaces:', err);
                // Retry up to 3 times with increasing delay (cache might not be ready)
                if (retryCount < 3) {
                    setTimeout(() => loadNamespaces(retryCount + 1), 1000 * (retryCount + 1));
                }
            }

        function renderCircularChart(label, percent, sublabel, color) {
            const raw = Math.max(0, percent || 0);
            const fill = Math.min(100, raw).toFixed(1);     // visual cap

                        <path class="circle circle-${color}" stroke-dasharray="${fill}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <text x="18" y="20.35" class="percentage">${display}%</text>
                    </svg>
                    <div class="text-xs text-slate-400">${sublabel}</div>
                </div>
            `;
        }

        // Generic table renderer
        function renderTable(columns, data, actions = null) {
            if (!data || data.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="fas fa-inbox"></i></div>
                        <div class="empty-state-title">No Resources Found</div>
                        <div class="empty-state-message">There are no resources to display in this view.</div>
                    </div>
                `;
            }
            return `
                <div class="table-container">
                    <table class="w-full">
                        <thead class="table-header">
                            <tr>
                                ${columns.map(col => `<th class="text-left">${col.label}</th>`).join('')}
                                ${actions ? '<th class="text-left">Actions</th>' : ''}
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700">
                            ${data.map(row => `
                                <tr class="hover:bg-slate-700/50">
                                    ${columns.map(col => `<td class="px-4 py-3 text-sm ${col.class || ''}">${col.render ? col.render(row) : row[col.key] || '-'}</td>`).join('')}
                                    ${actions ? `<td class="px-4 py-3 text-sm">${actions(row)}</td>` : ''}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

        }

        // Error state renderer
        function renderErrorState(resource, message) {
            return `
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="fas fa-exclamation-triangle" style="color: #f59e0b;"></i></div>
                    <div class="empty-state-title">Unable to Load ${formatViewName(resource)}</div>
                    <div class="empty-state-message">
                        ${message.includes('Failed to fetch') || message.includes('NetworkError')
                            ? 'Could not connect to the server. Please check your connection and try again.'
                            : 'An error occurred while loading data. Please try refreshing the page.'}

                    <button onclick="refreshCurrentView()" class="mt-4 px-4 py-2 bg-k8s-blue hover:bg-k8s-darkblue rounded text-white text-sm">
                        <i class="fas fa-redo mr-2"></i>Try Again
                    </button>
                </div>
            `;
        }

        // Safely get items from API response
        function getItems(data) {
            if (!data) return [];
            let items = [];
            if (Array.isArray(data.items)) items = data.items;
            else if (Array.isArray(data)) items = data;
            else return [];

            // Sort by namespace, then by name
            return items.sort((a, b) => {
                const nsA = (a.namespace || '').toLowerCase();
                const nsB = (b.namespace || '').toLowerCase();
                if (nsA !== nsB) return nsA.localeCompare(nsB);
                const nameA = (a.name || '').toLowerCase();
                const nameB = (b.name || '').toLowerCase();
                return nameA.localeCompare(nameB);
            });
        }

        // Map a Kubernetes-derived status string to a distinct CSS class.
        // Match exact tokens (not substrings) so e.g. "CrashLoopBackOff" gets
        // its own pill and doesn't collapse into a generic "failed" bucket.
        function statusClass(status) {
            const s = (status || '').toLowerCase().trim();
            // Healthy / running — green
            if (s === 'running' || s === 'ready' || s === 'bound' || s === 'active' || s === 'available' ||
                s === 'attached' || s === 'healthy') return 'status-running';
            // Successfully completed — blue
            if (s === 'succeeded' || s === 'completed') return 'status-succeeded';
            // Waiting to schedule — yellow
            if (s === 'pending') return 'status-pending';
            // Coming up (containers being created or pod initializing) — cyan
            if (s === 'containercreating' || s === 'podinitializing' || s.startsWith('init:')) return 'status-creating';
            // Graceful shutdown — orange
            if (s === 'terminating') return 'status-terminating';
            // Image / config problems — amber (recoverable but stuck)
            if (s === 'imagepullbackoff' || s === 'errimagepull' || s === 'invalidimagename' ||
                s === 'createcontainerconfigerror' || s === 'createcontainererror') return 'status-imageerror';
            // Crash-looping container — red
            if (s === 'crashloopbackoff') return 'status-crashloop';
            // OOM-killed — deep red
            if (s === 'oomkilled') return 'status-oomkilled';
            // Pod-Ready condition is False but containers are running — rose
            if (s === 'notready') return 'status-notready';
            // Generic errors / non-zero exits — red
            if (s === 'failed' || s === 'error' || s.startsWith('exitcode:') || s.startsWith('signal:') ||
                s === 'rundockererror' || s === 'startup probefailed') return 'status-failed';
            // Unknown / NodeLost — slate
            if (s === 'unknown' || s === 'nodelost') return 'status-unknown';
            // Anything else — slate (still rendered as a pill, not bare text)
            return 'status-unknown';
        }

        // Optional Lucide icon shown inside the pill for "in-progress" states.
        // Healthy / terminal states keep the simple colored dot.
        function statusIcon(status) {
            const s = (status || '').toLowerCase().trim();
            if (s.startsWith('init:')) return 'loader-2';
            if (s === 'containercreating' || s === 'podinitializing') return 'loader-2';
            if (s === 'pending') return 'loader-2';
            if (s === 'terminating') return 'circle-dashed';
            return null;
        }

        // statusPillHTML builds the full pill markup including the optional
        // spinning icon. Use this everywhere a status is rendered.
        function statusPillHTML(status) {
            const text = status || '';
            const cls = statusClass(text);
            const icon = statusIcon(text);
            if (icon) {
                return `<span class="${cls} has-icon"><i data-lucide="${icon}" class="status-spin"></i>${text}</span>`;
            }
            return `<span class="${cls}">${text}</span>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

                                <div><span class="text-slate-400">Container Runtime:</span> ${data.systemInfo?.containerRuntimeVersion || '-'}</div>
                                <div><span class="text-slate-400">Kubelet:</span> ${data.systemInfo?.kubeletVersion || '-'}</div>
                                <div><span class="text-slate-400">OS:</span> ${data.systemInfo?.operatingSystem || '-'}</div>
                                <div><span class="text-slate-400">Architecture:</span> ${data.systemInfo?.architecture || '-'}</div>
                                <div class="col-span-2"><span class="text-slate-400">Machine ID:</span> <span class="text-xs">${data.systemInfo?.machineID || '-'}</span></div>
                            </div>
                        </div>

                        <!-- Taints -->
                        ${data.taints?.length > 0 ? `
                        <div class="bg-slate-700 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-3">Taints (${data.taints.length})</h3>
                            <div class="space-y-2">
                                ${data.taints.map(t => `
                                    <div class="flex items-center gap-2 text-sm">
                                        <span class="px-2 py-1 rounded text-xs ${t.effect === 'NoSchedule' ? 'bg-yellow-600/50' : t.effect === 'NoExecute' ? 'bg-red-600/50' : 'bg-blue-600/50'}">${t.effect}</span>
                                        <span><span class="text-slate-400">${t.key}</span>${t.value ? `=<span class="text-white">${t.value}</span>` : ''}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}

                        <!-- Conditions -->
                        <div class="bg-slate-700 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-3">Conditions</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-xs">
                                    <thead><tr class="text-slate-400 border-b border-slate-600">
                                        <th class="text-left p-2">Type</th>
                                        <th class="text-left p-2">Status</th>
                                        <th class="text-left p-2">Reason</th>
                                    </tr></thead>
                                    <tbody>
                                        ${data.conditions?.map(c => `
                                            <tr class="border-b border-slate-600/50">
                                                <td class="p-2">${c.type}</td>
                                                <td class="p-2 ${c.status === 'True' ? 'text-green-400' : c.status === 'False' ? 'text-slate-400' : 'text-yellow-400'}">${c.status}</td>
                                                <td class="p-2 text-slate-400">${c.reason || '-'}</td>
                                            </tr>
                                        `).join('') || ''}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Labels -->
                        <div class="bg-slate-700 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-3">Labels</h3>
                            <div class="flex flex-wrap gap-1">
                                ${Object.entries(data.labels || {}).map(([k, v]) => `<span class="px-2 py-1 bg-slate-600 rounded text-xs">${k}=${v}</span>`).join('') || 'None'}
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('detail-modal').classList.remove('hidden');
            } catch (err) {
                toast('Error loading node details: ' + err.message);
            }
        }

        // ===========================================================
        // Generic live-table backed by the SSE watch endpoint.
        //   liveTable.open({ kind, title, columns, actions, ... })
        // Manages: scaffold render, SSE stream, snapshot/add/update/delete
        // events, periodic reconcile, namespace filtering, and cleanup on
        // navigate.
        // ===========================================================
        const liveTable = {
            es: null,
            resyncTimer: null,
            cfg: null,
            rowsByKey: new Map(),
            tableId: 'live-table',
            countId: 'live-count',
            liveId: 'live-status',

            open(cfg) {
                this.close();
                this.cfg = cfg;
                this.rowsByKey = new Map();
                this._renderScaffold();
                if (!currentCluster) return;
                this._setStatus('connecting');

                // Fallback to REST if SSE doesn't deliver in 3s.
                const fallbackTimer = setTimeout(async () => {
                    if (this.rowsByKey.size === 0) {
                        try {
                            const data = await fetch(`${getClusterAPI()}/${cfg.restPath || cfg.kind}`).then(r => r.json());
                            const items = getItems(data);
                            items.forEach(r => this.rowsByKey.set(this._keyOf(r), r));
                            this._renderAll();
                        } catch (_) {}
                    }
                }, 3000);

                this.es = new EventSource(`${getClusterAPI()}/watch/${cfg.kind}`);
                this.es.addEventListener('snapshot', (e) => {
                    clearTimeout(fallbackTimer);
                    this._setStatus('live');
                    const rows = JSON.parse(e.data);
                    this.rowsByKey = new Map(rows.map(r => [this._keyOf(r), r]));
                    this._renderAll();
                });
                const onChange = (type) => (e) => {
                    this._setStatus('live');
                    const ev = JSON.parse(e.data);
                    if (type === 'delete') {
                        if (ev.key) this._remove(ev.key);
                    } else if (ev.row) {
                        this._upsert(ev.row);
                    }
                };
                this.es.addEventListener('add', onChange('add'));
                this.es.addEventListener('update', onChange('update'));
                this.es.addEventListener('delete', onChange('delete'));
                this.es.addEventListener('ping', () => this._setStatus('live'));
                this.es.onerror = () => { this._setStatus('reconnecting'); this._resync(); };

                this.resyncTimer = setInterval(() => this._resync(), 10000);
            },

            close() {
                if (this.es) { this.es.close(); this.es = null; }
                if (this.resyncTimer) { clearInterval(this.resyncTimer); this.resyncTimer = null; }
                this.cfg = null;
                this.rowsByKey = new Map();
            },

            // Optimistic delete used by deletePod/deleteDeployment etc.
            removeRow(key) { this._remove(key); },

            _keyOf(r) { return `${r.namespace || ''}/${r.name || ''}`; },

            _passesFilter(r) {
                if (!this.cfg.namespaceFilter) return true;
                return !currentNamespace || r.namespace === currentNamespace;
            },

            _sort(a, b) {
                const ns = (a.namespace || '').localeCompare(b.namespace || '');
                return ns !== 0 ? ns : (a.name || '').localeCompare(b.name || '');
            },

            _renderScaffold() {
                const cfg = this.cfg;
                const content = document.getElementById('content');
                const headers = cfg.columns.map(c => `<th class="text-left">${c.label}</th>`).join('') + (cfg.actions ? '<th class="text-left">Actions</th>' : '');
                content.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <h1 class="text-xl font-bold">${cfg.title}</h1>
                            <span id="${this.liveId}" class="text-xs text-yellow-400 flex items-center"><span class="inline-block w-2 h-2 rounded-full bg-yellow-400 mr-1.5 align-middle"></span>Connecting…</span>
                        </div>
                        <span id="${this.countId}" class="text-sm text-slate-400">…</span>
                    </div>
                    <div id="${this.tableId}" class="bg-slate-800 rounded-lg border border-slate-700">
                        <div class="table-container">
                            <table class="w-full">
                                <thead class="table-header"><tr>${headers}</tr></thead>
                                <tbody class="divide-y divide-slate-700"></tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            _rowHTML(r) {
                const cells = this.cfg.columns.map(c => `<td class="px-4 py-3 text-sm ${c.class || ''}">${c.render ? c.render(r) : (r[c.key] ?? '')}</td>`).join('');
                const actions = this.cfg.actions ? `<td class="px-4 py-3 text-sm">${this.cfg.actions(r)}</td>` : '';
                return cells + actions;
            },

            _renderAll() {
                const tbody = document.querySelector(`#${this.tableId} tbody`);
                if (!tbody) return;
                const rows = [...this.rowsByKey.values()].filter(r => this._passesFilter(r)).sort((a, b) => this._sort(a, b));
                tbody.innerHTML = rows.map(r => `<tr data-key="${this._keyOf(r)}" class="hover:bg-slate-700/50">${this._rowHTML(r)}</tr>`).join('');
                this._updateCount(rows.length);
            },

            _upsert(r) {
                const key = this._keyOf(r);
                this.rowsByKey.set(key, r);
                const tbody = document.querySelector(`#${this.tableId} tbody`);
                if (!tbody) return;
                if (!this._passesFilter(r)) {
                    const existing = tbody.querySelector(`tr[data-key="${CSS.escape(key)}"]`);
                    if (existing) { existing.remove(); this._updateCount(tbody.children.length); }
                    return;
                }
                let tr = tbody.querySelector(`tr[data-key="${CSS.escape(key)}"]`);
                if (tr) {
                    tr.innerHTML = this._rowHTML(r);
                    tr.classList.add('bg-yellow-500/10');
                    setTimeout(() => tr && tr.classList.remove('bg-yellow-500/10'), 600);
                } else {
                    tr = document.createElement('tr');
                    tr.setAttribute('data-key', key);
                    tr.className = 'hover:bg-slate-700/50';
                    tr.innerHTML = this._rowHTML(r);
                    // Insert at the correct sorted position rather than appending.
                    // Walk existing rows; insert before the first one that
                    // sorts after the new row.
                    let inserted = false;
                    for (const child of tbody.children) {
                        const childKey = child.getAttribute('data-key');
                        const childRow = this.rowsByKey.get(childKey);
                        if (!childRow) continue;
                        if (this._sort(r, childRow) < 0) {
                            tbody.insertBefore(tr, child);
                            inserted = true;
                            break;
                        }
                    }
                    if (!inserted) tbody.appendChild(tr);
                    // Briefly highlight the new row so the eye catches it.
                    tr.classList.add('bg-green-500/10');
                    setTimeout(() => tr && tr.classList.remove('bg-green-500/10'), 800);
                    this._updateCount(tbody.children.length);
                }
            },

            _remove(key) {
                this.rowsByKey.delete(key);
                const tbody = document.querySelector(`#${this.tableId} tbody`);
                if (!tbody) return;
                const tr = tbody.querySelector(`tr[data-key="${CSS.escape(key)}"]`);
                if (tr) { tr.remove(); this._updateCount(tbody.children.length); }
            },

            _updateCount(n) {
                const el = document.getElementById(this.countId);
                if (el) el.textContent = `${n} total`;
            },

            _setStatus(s) {
                const el = document.getElementById(this.liveId);
                if (!el) return;
                if (s === 'live') {
                    el.innerHTML = '';
                    el.className = 'hidden';
                } else if (s === 'connecting') {
                    el.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-yellow-400 mr-1.5 align-middle"></span>Connecting…';
                    el.className = 'text-xs text-yellow-400 flex items-center';
                } else {
                    el.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-red-400 mr-1.5 align-middle"></span>Reconnecting…';
                    el.className = 'text-xs text-red-400 flex items-center';
                }
            },

            async _resync() {
                if (!this.cfg || !currentCluster) return;
                try {
                    const data = await fetch(`${getClusterAPI()}/${this.cfg.restPath || this.cfg.kind}`).then(r => r.json());
                    const items = getItems(data);
                    const newKeys = new Set(items.map(r => this._keyOf(r)));
                    for (const r of items) {
                        const key = this._keyOf(r);
                        const cur = this.rowsByKey.get(key);
                        if (!cur || JSON.stringify(cur) !== JSON.stringify(r)) this._upsert(r);
                    }
                    for (const key of [...this.rowsByKey.keys()]) {
                        if (!newKeys.has(key)) this._remove(key);
                    }
                } catch (_) {}
            },
        };
        // Backward-compat for callers that referenced the old names.
        function podsClose() { liveTable.close(); }
        function podsRemove(key) { liveTable.removeRow(key); }

        async function renderPods() {
            liveTable.open({
                kind: 'pods',
                title: 'Pods',
                namespaceFilter: true,
                columns: [
                    { label: 'Name', render: r => `<span class="cell-name cursor-pointer hover:underline hover:text-k8s-blue" onclick="showPodDetail('${r.namespace}', '${r.name}')">${r.name}</span>` },
                    { label: 'Namespace', class: 'cell-namespace', render: r => r.namespace || '' },
                    { label: 'Status', render: r => statusPillHTML(r.status) },
                    { label: 'Ready', render: r => r.ready || '' },
                    { label: 'Node', render: r => r.node || '' },
                    { label: 'Age', class: 'text-slate-400', render: r => r.age || '' },
                ],
                actions: r => `
                    <button onclick="viewLogs('${r.namespace}', '${r.name}')" class="text-blue-400 hover:text-blue-300 mr-2" title="View Logs"><i class="fas fa-file-alt"></i></button>
                    <button onclick="editResourceYaml('pods', '${r.namespace}', '${r.name}')" class="text-green-400 hover:text-green-300 mr-2" title="Edit"><i class="fas fa-edit"></i></button>
                    <button onclick="deletePod('${r.namespace}', '${r.name}')" class="text-red-400 hover:text-red-300" title="Delete"><i class="fas fa-trash"></i></button>
                `,
            });
        }

        // Pod drawer helpers. All pod data is escaped; values are untrusted.
        // Layout: every section is a card with a heading; facts are label/value
        // rows in a .kv-grid so labels and values line up in columns.
        const podKV = (label, value) => `<div class="kv-label">${label}</div><div class="kv-value">${value}</div>`;
        const podSection = (title, body, count) => `
            <div class="bg-slate-700 rounded p-4">
                <h3 class="text-sm font-semibold text-k8s-blue mb-3">${title}${count != null ? ` <span class="text-slate-400 font-normal">(${count})</span>` : ''}</h3>
                ${body}
            </div>`;
        const podSub = (title, body) => `<div class="mt-3"><div class="kv-sub">${title}</div>${body}</div>`;
        const podChips = items => `<div class="flex flex-wrap gap-1.5">${items.map(i => `<span class="px-2 py-0.5 bg-slate-700 rounded text-xs">${escapeHtml(i)}</span>`).join('')}</div>`;
        const podLines = items => `<pre class="code-block mono text-[11px] rounded p-2 whitespace-pre-wrap break-all">${items.map(escapeHtml).join('\n')}</pre>`;
        const podShellQuote = a => /^[\w@%+=:,./-]+$/.test(a) ? a : `'${a.replace(/'/g, `'\\''`)}'`;
        const podYesNo = b => b ? '<span class="text-yellow-400">Yes</span>' : 'No';

        function podContainerHTML(c) {
            const e = escapeHtml;
            const argv = [...(c.command || []), ...(c.args || [])];
            const probes = [['Liveness', c.probes?.liveness], ['Readiness', c.probes?.readiness], ['Startup', c.probes?.startup]].filter(([, v]) => v);
            const req = Object.entries(c.resources?.requests || {}).map(([k, v]) => `${k}: ${v}`).join(', ');
            const lim = Object.entries(c.resources?.limits || {}).map(([k, v]) => `${k}: ${v}`).join(', ');
            const ls = c.lastState;
            const env = [...(c.env || []).map(v => `${v.name}  ← ${v.source || 'literal'}`), ...(c.envFrom || []).map(f => `(all keys)  ← ${f}`)];
            return `
                <div class="bg-slate-600 rounded p-3">
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <span class="font-medium text-white break-all">${e(c.name)}</span>
                        <span class="text-xs px-2 py-1 rounded shrink-0 ${c.ready ? 'bg-green-600' : 'bg-red-600'}">${e(c.state || 'Unknown')}</span>
                    </div>
                    <div class="kv-grid text-xs">
                        ${podKV('Image', `<span class="mono break-all">${e(c.image)}</span>`)}
                        ${podKV('Pull Policy', e(c.imagePullPolicy || '-'))}
                        ${podKV('Ready', c.ready ? 'Yes' : 'No')}
                        ${podKV('Restarts', c.restartCount ? `<span class="text-yellow-400">${c.restartCount}</span>` : '0')}
                        ${c.ports?.length ? podKV('Ports', e(c.ports.map(p => (p.name ? p.name + ' ' : '') + p.containerPort + '/' + p.protocol).join(', '))) : ''}
                        ${req ? podKV('Requests', e(req)) : ''}
                        ${lim ? podKV('Limits', e(lim)) : ''}
                        ${c.workingDir ? podKV('Working Dir', `<span class="mono">${e(c.workingDir)}</span>`) : ''}
                    </div>
                    ${ls ? podSub('Last State', `<div class="rounded px-3 py-2 bg-red-900/40 border border-red-800 text-xs">
                        <div class="kv-grid">
                            ${podKV('Reason', `<span class="text-red-400 font-medium">${e(ls.reason || 'Terminated')}</span>`)}
                            ${podKV('Exit Code', `${ls.exitCode}${ls.signal ? ` (signal ${ls.signal})` : ''}`)}
                            ${podKV('Started', e(ls.startedAt || '-'))}
                            ${podKV('Finished', e(ls.finishedAt || '-'))}
                            ${ls.message ? podKV('Message', `<span class="whitespace-pre-wrap break-all">${e(ls.message)}</span>`) : ''}
                        </div></div>`) : ''}
                    ${argv.length ? podSub('Command &amp; Args', `<pre class="code-block mono text-[11px] rounded p-2 whitespace-pre-wrap break-all">${e(argv.map(podShellQuote).join(' \\\n    '))}</pre>`) : ''}
                    ${probes.length ? podSub('Probes', `<div class="kv-grid text-xs">${probes.map(([k, v]) => podKV(k, `<span class="mono break-all">${e(v)}</span>`)).join('')}</div>`) : ''}
                    ${c.securityContext?.length ? podSub('Security Context', podChips(c.securityContext)) : ''}
                    ${env.length ? `<details class="mt-3"><summary class="kv-sub cursor-pointer">Environment (${env.length}) — values hidden</summary>${podLines(env)}</details>` : ''}
                    ${c.volumeMounts?.length ? `<details class="mt-3"><summary class="kv-sub cursor-pointer">Volume Mounts (${c.volumeMounts.length})</summary>${podLines(c.volumeMounts.map(m => `${m.mountPath}  ← ${m.name}${m.readOnly ? '  (ro)' : ''}`))}</details>` : ''}
                </div>`;
        }

        function podSchedulingHTML(sch) {
            if (!sch) return '';
            const ns = Object.entries(sch.nodeSelector || {}).map(([k, v]) => `${k}=${v}`);
            const facts = [
                sch.priorityClass || sch.priority != null ? podKV('Priority', escapeHtml(`${sch.priorityClass || '-'}${sch.priority != null ? ` (${sch.priority})` : ''}`)) : '',
                sch.schedulerName ? podKV('Scheduler', escapeHtml(sch.schedulerName)) : '',
                ns.length ? podKV('Node Selector', podChips(ns)) : '',
            ].join('');
            const body = (facts ? `<div class="kv-grid text-sm">${facts}</div>` : '')
                + (sch.tolerations?.length ? podSub(`Tolerations (${sch.tolerations.length})`, podLines(sch.tolerations)) : '')
                + (sch.affinity?.length ? podSub('Affinity', podLines(sch.affinity)) : '');
            return body ? podSection('Scheduling', body) : '';
        }

        function podSettingsHTML(st) {
            if (!st) return '';
            return podSection('Pod Settings', `
                <div class="kv-grid kv-grid-2 text-sm">
                    ${podKV('Host Network', podYesNo(st.hostNetwork))}
                    ${podKV('DNS Policy', escapeHtml(st.dnsPolicy || '-'))}
                    ${podKV('Host PID', podYesNo(st.hostPID))}
                    ${podKV('Grace Period', st.terminationGracePeriodSeconds != null ? `${st.terminationGracePeriodSeconds}s` : '-')}
                    ${podKV('Host IPC', podYesNo(st.hostIPC))}
                    ${podKV('SA Token', st.automountServiceAccountToken === false ? 'Not mounted' : 'Mounted')}
                </div>
                ${st.securityContext?.length ? podSub('Pod Security Context', podChips(st.securityContext)) : ''}`);
        }

        // Section order: identity → what runs → storage → placement → runtime → metadata.
        async function showPodDetail(namespace, name) {
            try {
                const data = await fetchAPI(`${getClusterAPI()}/pods/${namespace}/${name}`);
                const e = escapeHtml;
                const labels = Object.entries(data.labels || {});
                const annotations = Object.entries(data.annotations || {});
                document.getElementById('modal-title').textContent = `Pod: ${namespace}/${name}`;
                document.getElementById('modal-content').innerHTML = `
                    <div class="space-y-4">
                        ${podSection('Basic Information', `
                            <div class="kv-grid kv-grid-2 text-sm">
                                ${podKV('Status', statusPillHTML(data.status))}
                                ${podKV('Age', e(data.age || '-'))}
                                ${podKV('Node', e(data.node || '-'))}
                                ${podKV('Created', e(data.createdAt || '-'))}
                                ${podKV('Pod IP', `<span class="mono">${e(data.podIP || '-')}</span>`)}
                                ${podKV('Host IP', `<span class="mono">${e(data.hostIP || '-')}</span>`)}
                                ${podKV('QoS Class', e(data.qosClass || '-'))}
                                ${podKV('Restart Policy', e(data.restartPolicy || '-'))}
                                ${podKV('Service Account', e(data.serviceAccount || '-'))}
                            </div>`)}

                        ${podSection('Containers', `<div class="space-y-3">${(data.containers || []).map(podContainerHTML).join('') || '<div class="text-slate-400 text-sm">No containers</div>'}</div>`, data.containers?.length || 0)}

                        ${data.initContainers?.length ? podSection('Init Containers', `<div class="space-y-3">${data.initContainers.map(podContainerHTML).join('')}</div>`, data.initContainers.length) : ''}

                        ${data.volumes?.length ? podSection('Volumes', `
                            <div class="kv-grid text-xs">
                                ${data.volumes.map(v => podKV(`<span class="text-white">${e(v.name)}</span>`, `<span class="text-yellow-400">${e(v.type)}</span>${v.source && v.source !== '-' ? ` <span class="mono text-slate-400 break-all">${e(v.source)}</span>` : ''}`)).join('')}
                            </div>`, data.volumes.length) : ''}

                        ${podSchedulingHTML(data.scheduling)}
                        ${podSettingsHTML(data.settings)}

                        ${labels.length ? podSection('Labels', podChips(labels.map(([k, v]) => `${k}: ${v}`)), labels.length) : ''}

                        ${annotations.length ? `
                        <div class="bg-slate-700 rounded p-4">
                            <details>
                                <summary class="cursor-pointer text-sm font-semibold text-k8s-blue">Annotations <span class="text-slate-400 font-normal">(${annotations.length})</span></summary>
                                <pre class="code-block mono text-[11px] rounded p-2 mt-3 whitespace-pre-wrap break-all max-h-80 overflow-auto">${annotations.map(([k, v]) => e(`${k}: ${v}`)).join('\n')}</pre>
                            </details>
                        </div>` : ''}
                    </div>
                `;
                document.getElementById('detail-modal').classList.remove('hidden');
            } catch (err) {
                toast('Error: ' + err.message);
            }
        }

        async function deletePod(namespace, name) {
            if (!await uiConfirm('Delete pod', `Delete pod "${name}" in namespace "${namespace}"?`, { okText: 'Delete', danger: true })) return;
            try {
                await fetch(`${getClusterAPI()}/pods/${namespace}/${name}`, { method: 'DELETE' });
                // If on the live pods view, just remove the row optimistically.
                // The SSE 'delete' event confirms it, and the replacement pod
                // arrives via SSE 'add' — we don't want to tear down the
                // EventSource (refreshCurrentView re-opens it and can race
                // with the add event for the new pod).
                if (currentView === 'pods' && liveTable.es) {
                    liveTable.removeRow(`${namespace}/${name}`);
                } else {
                    refreshCurrentView();
                }
            } catch (err) {
                toast('Error: ' + err.message);
            }
        }

        // Deployment actions
        async function scaleDeployment(namespace, name) {
            const num = await uiPromptReplicas('deployment', namespace, name);
            if (num === null) return;
            try {
                await fetch(`${getClusterAPI()}/deployments/${namespace}/${name}/scale`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ replicas: num })
                });
                refreshCurrentView();
            } catch (err) {
                toast('Error: ' + err.message);
            }
        }

        // kind: 'deployments' | 'statefulsets' | 'daemonsets'
        async function restartWorkload(kind, namespace, name) {
            const singular = { deployments: 'Deployment', statefulsets: 'StatefulSet', daemonsets: 'DaemonSet' }[kind] || kind;
            if (!await uiConfirm(`Restart ${singular}`, `Restart ${singular} "${name}" in namespace "${namespace}"? Pods are recreated with a rolling update.`, { okText: 'Restart' })) return;
            try {
                const res = await fetch(`${getClusterAPI()}/${kind}/${namespace}/${name}/restart`, { method: 'POST' });

                    toast(data.details || data.error || `HTTP ${res.status}`, 'error');
                    return;

                toast(`${singular} "${name}" restarting`, 'success');
                refreshCurrentView();
            } catch (err) {

        window._yamlEditor = null;

        async function editResourceYaml(kind, namespace, name) {
            // Cluster-scoped resources pass null/empty namespace; encode as
            // "_" placeholder so URL has a stable shape.
            const ns = namespace || '_';
            const display = kind.startsWith('cr:') ? kind.split(':')[3]
                : GENERIC_VIEWS[kind] ? GENERIC_VIEWS[kind].name.replace(/s$/, '')
                : kind.charAt(0).toUpperCase() + kind.slice(1).replace(/s$/, '');
            const titleSuffix = namespace ? `${namespace}/${name}` : name;
            document.getElementById('modal-title').textContent = `Edit ${display}: ${titleSuffix}`;
            // Fixed-height editor + sticky footer so the Save button is always
            // reachable regardless of YAML length. modal-content itself can
            // still scroll if the viewport is very short.
            document.getElementById('modal-content').innerHTML = `
                <div class="space-y-3">
                    <div class="text-xs text-slate-400 flex items-center gap-2">
                        <i class="fas fa-file-code"></i>
                        <span>Editing live YAML — Save sends a Kubernetes Update.</span>
                    </div>
                    <div id="yaml-editor-container"
                         class="code-block rounded overflow-hidden"
                         style="height: calc(100vh - 220px); min-height: 280px;">
                        <div class="p-3 text-sm text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i>Loading YAML...</div>
                    </div>
                    <div id="yaml-editor-error" class="hidden px-3 py-2 rounded text-sm bg-red-900/40 border border-red-700 text-red-200 whitespace-pre-wrap mono"></div>
                </div>
                <div class="sticky bottom-0 left-0 right-0 -mx-4 -mb-4 mt-4 px-4 py-3 bg-slate-800 border-t border-slate-700 flex items-center justify-end gap-2">
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-600 hover:bg-slate-500 rounded text-sm">Cancel</button>
                    <button id="yaml-save-btn" onclick="saveResourceYaml('${kind}', '${ns}', '${name}')" class="px-4 py-2 bg-green-600 hover:bg-green-500 rounded text-sm">
                        <i class="fas fa-check mr-1"></i>Save
                    </button>
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');

            try {
                if (typeof window.loadCodeMirror !== 'function') {
                    throw new Error('Editor not loaded yet — refresh the page');
                }
                const [yamlRes, cm] = await Promise.all([
                    fetch(`${getClusterAPI()}/yaml/${kind}/${ns}/${name}`),
                    window.loadCodeMirror()
                ]);
                if (!yamlRes.ok) {
                    let detail = `HTTP ${yamlRes.status}`;
                    try { const j = await yamlRes.json(); detail = j.details || j.error || detail; } catch (_) {}
                    throw new Error(detail);
                }
                const yamlText = await yamlRes.text();
                const container = document.getElementById('yaml-editor-container');
                if (!container) return; // user closed during load
                container.innerHTML = '';
                if (window._yamlEditor) { window._yamlEditor.destroy(); window._yamlEditor = null; }
                window._yamlEditor = new cm.EditorView({
                    parent: container,
                    doc: yamlText,
                    extensions: [cm.basicSetup, cm.yaml(), cm.yamlTheme]
                });
            } catch (err) {
                showYamlError(`Failed to load YAML: ${err.message}`);
            }
        }

        function showYamlError(msg) {
            const errBox = document.getElementById('yaml-editor-error');
            if (!errBox) return;
            errBox.classList.remove('hidden');
            errBox.textContent = msg;
        }

        async function saveResourceYaml(kind, namespace, name) {
            if (!window._yamlEditor) return;
            const yamlText = window._yamlEditor.state.doc.toString();
            const errBox = document.getElementById('yaml-editor-error');
            const saveBtn = document.getElementById('yaml-save-btn');
            if (errBox) errBox.classList.add('hidden');
            if (saveBtn) saveBtn.disabled = true;

            try {
                const res = await fetch(`${getClusterAPI()}/yaml/${kind}/${namespace}/${name}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/yaml' },
                    body: yamlText
                });
                if (!res.ok) {
                    const j = await res.json().catch(() => ({}));
                    throw new Error(j.details || j.error || `HTTP ${res.status}`);
                }
                if (window._yamlEditor) { window._yamlEditor.destroy(); window._yamlEditor = null; }
                closeModal();
                refreshCurrentView();
            } catch (err) {
                showYamlError(`Save failed: ${err.message}`);
                if (saveBtn) saveBtn.disabled = false;
            }
        }

        async function loadLogContainers(namespace, pod) {
            const select = document.getElementById('log-container');
            if (!select) return;
            try {
                const data = await fetchAPI(`${getClusterAPI()}/pods/${namespace}/${pod}`);
                const containers = data.containers || [];
                const initContainers = data.initContainers || [];
                if (containers.length === 0 && initContainers.length === 0) {
                    select.disabled = true;
                    setTimeout(startLogStream, 50);
                    return;
                }
                const opts = [];
                containers.forEach(ct => {
                    opts.push(`<option value="${ct.name}">${ct.name}</option>`);
                });
                initContainers.forEach(ct => {
                    opts.push(`<option value="${ct.name}">${ct.name} (init)</option>`);
                });
                select.innerHTML = opts.join('');
                select.disabled = containers.length + initContainers.length <= 1;
                // Default to the first regular container (kubectl-style default)
                select.value = containers[0]?.name || initContainers[0]?.name || '';
                setTimeout(startLogStream, 50);
            } catch (err) {
                // Fall back to streaming without specifying a container — works for single-container pods.
                select.disabled = true;
                setTimeout(startLogStream, 50);
            }
        }

        function onLogContainerChange() {
            const ns = document.getElementById('log-namespace')?.value;
            const pod = document.getElementById('log-pod')?.value;
            if (ns && pod) startLogStream();
        }

        function startLogStream() {
            stopLogStream();
            const namespace = document.getElementById('log-namespace').value;
            const pod = document.getElementById('log-pod').value;
            if (!namespace || !pod) {
                toast('Please enter namespace and pod name');
                return;
            }
            const container = document.getElementById('log-container')?.value || '';
            const logOutput = document.getElementById('log-output');
            logOutput.innerHTML = '<p class="text-slate-500">Connecting...</p>';

            const url = `${getClusterAPI()}/logs/${namespace}/${pod}` +
                (container ? `?container=${encodeURIComponent(container)}` : '');
            eventSource = new EventSource(url);
            eventSource.addEventListener('log', (e) => {
                if (logOutput.querySelector('.text-slate-500')) logOutput.innerHTML = '';
                const line = document.createElement('div');
                line.textContent = e.data;
                line.className = 'whitespace-pre'; // inherits white from .code-block
                logOutput.appendChild(line);
                logOutput.scrollTop = logOutput.scrollHeight;
            });
            eventSource.addEventListener('error', (e) => {
                const line = document.createElement('div');
                line.textContent = e.data || 'Stream error';
                line.className = 'text-red-400';
                logOutput.appendChild(line);
            });
            eventSource.onerror = () => {
                const line = document.createElement('div');
                line.textContent = '[Stream disconnected]';
                line.className = 'text-yellow-400';
                logOutput.appendChild(line);
            };
        }

        function stopLogStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        }

        function clearLogs() {
            document.getElementById('log-output').innerHTML = '<p class="text-slate-500">Logs cleared</p>';
        }

        async function showSecretDetail(namespace, name, reveal = false) {
            try {

                const data = await fetchAPI(url);
                document.getElementById('modal-title').textContent = `Secret: ${namespace}/${name}`;
                const items = data.data || [];
                const labels = data.labels || {};
                const annotations = data.annotations || {};
                document.getElementById('modal-content').innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-slate-700/40 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-3">Basic Information</h3>

                                <div><span class="text-slate-400">Namespace:</span> ${data.namespace || namespace}</div>
                                <div><span class="text-slate-400">Type:</span> <span class="mono">${data.type || ''}</span></div>
                                <div><span class="text-slate-400">Keys:</span> ${items.length}</div>
                                <div><span class="text-slate-400">Age:</span> ${data.age || ''}</div>
                            </div>
                        </div>
                        ${Object.keys(labels).length ? `
                        <div class="bg-slate-700/40 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-3">Labels</h3>
                            <div class="flex flex-wrap gap-2">
                                ${Object.entries(labels).map(([k, v]) => `<span class="px-2 py-1 bg-slate-600 rounded text-xs mono">${k}=${v}</span>`).join('')}
                            </div>
                        </div>` : ''}
                        ${Object.keys(annotations).length ? `
                        <div class="bg-slate-700/40 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-3">Annotations</h3>
                            <div class="space-y-1 text-xs mono break-all">
                                ${Object.entries(annotations).map(([k, v]) => `<div><span class="text-slate-400">${k}:</span> ${v}</div>`).join('')}
                            </div>
                        </div>` : ''}
                        <div class="bg-slate-700/40 rounded p-4">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="text-sm font-semibold text-k8s-blue">Data (${items.length} ${items.length === 1 ? 'key' : 'keys'})</h3>
                                <div class="flex gap-2">
                                    ${reveal
                                        ? `<button onclick="showSecretDetail('${namespace}','${name}',false)" class="px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded text-xs"><i class="fas fa-eraser mr-1"></i>Hide values</button>`
                                        : `<button onclick="showSecretDetail('${namespace}','${name}',true)" class="px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded text-xs"><i class="fas fa-key mr-1"></i>Reveal values</button>`}
                                    <button onclick="editResourceYaml('secrets','${namespace}','${name}')" class="px-2 py-1 bg-green-600 hover:bg-green-500 rounded text-xs"><i class="fas fa-edit mr-1"></i>Edit YAML</button>
                                </div>
                            </div>
                            ${items.length === 0 ? '<div class="text-sm text-slate-400">No data keys.</div>' : `
                            <div class="space-y-2">
                                ${items.map(it => {
                                    const safe = (it.value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                                    return `
                                    <div class="bg-slate-800 border border-slate-700 rounded p-2">
                                        <div class="flex items-center justify-between mb-1">
                                            <span class="text-xs font-medium text-slate-200 mono">${it.key}</span>
                                            <div class="flex items-center gap-2">
                                                <span class="text-[10px] text-slate-400">${it.size} bytes</span>
                                                ${reveal ? `<button onclick="navigator.clipboard.writeText(\`${(it.value || '').replace(/`/g,'\\`')}\`)" class="px-1.5 py-0.5 text-[10px] bg-slate-700 hover:bg-slate-600 rounded">Copy</button>` : ''}
                                            </div>
                                        </div>
                                        ${reveal
                                            ? `<pre class="code-block text-[11px] mono whitespace-pre-wrap break-all max-h-48 overflow-auto rounded p-2">${safe}</pre>`
                                            : `<div class="text-[11px] text-slate-500 italic">hidden — click "Reveal values" to show</div>`}
                                    </div>`;
                                }).join('')}
                            </div>`}
                        </div>
                    </div>
                `;
                document.getElementById('detail-modal').classList.remove('hidden');
            } catch (err) {
                toast('Error loading secret: ' + err.message);
            }
        }

        // Generic resource detail viewer
        // Structured summary for kinds opened via showResourceDetail that return
        // the raw Kubernetes object (jobs, cronjobs, replicasets, storage, ingress classes).
        function resourceSpecHTML(type, d) {
            const e = escapeHtml, spec = d.spec || {}, st = d.status || {}, ann = d.metadata?.annotations || {};
            const kv = (label, v) => v === undefined || v === null || v === '' ? '' : podKV(label, e(String(v)));
            const grid = rows => `<div class="kv-grid kv-grid-2 text-sm">${rows.join('')}</div>`;
            const images = tpl => {
                const cs = [...(tpl?.spec?.initContainers || []), ...(tpl?.spec?.containers || [])];
                return cs.length ? podSub('Containers', podLines(cs.map(c => `${c.name}: ${c.image}`))) : '';
            };
            const ago = ts => ts ? `${ts} (${helmAge(ts)} ago)` : '';
            const selector = sel => Object.entries(sel?.matchLabels || {}).map(([k, v]) => `${k}=${v}`);
            switch (type) {
                case 'replicasets': {
                    const sel = selector(spec.selector);
                    return podSection('Replica Set', grid([
                        kv('Desired', spec.replicas ?? 0), kv('Current', st.replicas ?? 0),
                        kv('Ready', st.readyReplicas ?? 0), kv('Available', st.availableReplicas ?? 0),
                    ]) + (sel.length ? podSub('Selector', podChips(sel)) : '') + images(spec.template));
                }
                case 'jobs': {
                    const cond = (st.conditions || []).find(c => c.status === 'True' && ['Complete', 'Failed', 'Suspended'].includes(c.type));
                    const state = cond ? cond.type : (st.active ? 'Running' : 'Pending');
                    const dur = st.startTime ? Math.round(((st.completionTime ? new Date(st.completionTime) : new Date()) - new Date(st.startTime)) / 1000) : null;
                    return podSection('Job', grid([
                        podKV('Status', statusPillHTML(state)), kv('Completions', `${st.succeeded || 0}/${spec.completions ?? 1}`),
                        kv('Active', st.active || 0), kv('Failed', st.failed || 0),
                        kv('Parallelism', spec.parallelism), kv('Backoff Limit', spec.backoffLimit),
                        kv('Started', st.startTime), kv('Completed', st.completionTime),
                        dur != null ? kv('Duration', dur < 60 ? `${dur}s` : `${Math.floor(dur / 60)}m ${dur % 60}s`) : '',
                        kv('TTL After Finish', spec.ttlSecondsAfterFinished != null ? `${spec.ttlSecondsAfterFinished}s` : ''),
                    ]) + (cond?.message ? podSub('Message', `<div class="text-sm">${e(cond.message)}</div>`) : '') + images(spec.template));
                }
                case 'cronjobs':
                    return podSection('Cron Job', grid([
                        podKV('Schedule', `<span class="mono">${e(spec.schedule || '-')}</span>`), kv('Time Zone', spec.timeZone || 'controller local'),
                        podKV('Suspended', spec.suspend ? '<span class="text-yellow-400">Yes</span>' : 'No'), kv('Concurrency', spec.concurrencyPolicy || 'Allow'),
                        kv('Active Jobs', (st.active || []).length), kv('Last Scheduled', ago(st.lastScheduleTime)),
                        kv('Last Success', ago(st.lastSuccessfulTime)),
                        kv('History Kept', `${spec.successfulJobsHistoryLimit ?? 3} ok / ${spec.failedJobsHistoryLimit ?? 1} failed`),
                    ]) + ((st.active || []).length ? podSub('Running Jobs', podLines(st.active.map(j => j.name))) : '') + images(spec.jobTemplate?.spec?.template));
                case 'persistentvolumeclaims':
                    return podSection('Persistent Volume Claim', grid([
                        podKV('Status', statusPillHTML(st.phase || '-')), kv('Capacity', st.capacity?.storage || '-'),
                        kv('Requested', spec.resources?.requests?.storage), kv('Access Modes', (spec.accessModes || []).join(', ')),
                        kv('Storage Class', spec.storageClassName), kv('Volume Mode', spec.volumeMode),
                        podKV('Volume', spec.volumeName ? `<span class="cursor-pointer hover:underline" onclick="showResourceDetail('persistentvolumes', null, '${e(spec.volumeName)}')">${e(spec.volumeName)}</span>` : '-'),
                    ]));
                case 'persistentvolumes': {
                    const src = ['csi', 'hostPath', 'local', 'nfs', 'iscsi', 'awsElasticBlockStore', 'gcePersistentDisk', 'azureDisk', 'cephfs', 'rbd'].find(k => spec[k]);
                    const srcDetail = src === 'csi' ? `${spec.csi.driver} (${spec.csi.volumeHandle})` : src === 'hostPath' || src === 'local' ? spec[src].path
                        : src === 'nfs' ? `${spec.nfs.server}:${spec.nfs.path}` : src || '';
                    const claim = spec.claimRef ? `${spec.claimRef.namespace}/${spec.claimRef.name}` : '';
                    return podSection('Persistent Volume', grid([
                        podKV('Status', statusPillHTML(st.phase || '-')), kv('Capacity', spec.capacity?.storage),
                        kv('Access Modes', (spec.accessModes || []).join(', ')), kv('Reclaim Policy', spec.persistentVolumeReclaimPolicy),
                        kv('Storage Class', spec.storageClassName), kv('Volume Mode', spec.volumeMode),
                        podKV('Claim', claim ? `<span class="cursor-pointer hover:underline" onclick="showResourceDetail('persistentvolumeclaims', '${e(spec.claimRef.namespace)}', '${e(spec.claimRef.name)}')">${e(claim)}</span>` : '-'),
                    ]) + (src ? podSub('Source', `<div class="kv-grid text-sm">${podKV(e(src), `<span class="mono break-all">${e(srcDetail)}</span>`)}</div>`) : ''));
                }
                case 'storageclasses': {
                    const params = Object.entries(d.parameters || {}).map(([k, v]) => `${k}: ${v}`);
                    return podSection('Storage Class', grid([
                        kv('Provisioner', d.provisioner), podKV('Default', ann['storageclass.kubernetes.io/is-default-class'] === 'true' ? '<span class="text-green-400">Yes</span>' : 'No'),
                        kv('Reclaim Policy', d.reclaimPolicy || 'Delete'), kv('Binding Mode', d.volumeBindingMode || 'Immediate'),
                        kv('Allow Expansion', d.allowVolumeExpansion ? 'Yes' : 'No'),
                    ]) + (params.length ? podSub('Parameters', podLines(params)) : ''));
                }
                case 'ingressclasses': {
                    const p = spec.parameters;
                    return podSection('Ingress Class', grid([
                        kv('Controller', spec.controller), podKV('Default', ann['ingressclass.kubernetes.io/is-default-class'] === 'true' ? '<span class="text-green-400">Yes</span>' : 'No'),
                        p ? kv('Parameters', `${p.kind} ${p.namespace ? p.namespace + '/' : ''}${p.name}`) : '',
                    ]));
                }
            }
            return '';
        }

        async function showResourceDetail(resourceType, namespace, name) {

                    url += `/${namespace}/${name}`;

                const data = await fetchAPI(url);

                // Update breadcrumb to show detail view
                updateBreadcrumb(resourceType, name);

                document.getElementById('modal-title').textContent = `${formatViewName(resourceType.replace(/s$/, ''))}: ${namespace ? namespace + '/' : ''}${name}`;

                // Build structured content based on resource type

                    const rules = data.rules || [];

                                            <tr class="border-b border-slate-600/50">
                                                <td class="p-2"><span class="text-purple-400">${(rule.apiGroups || ['*']).map(g => g || 'core').join(', ')}</span></td>
                                                <td class="p-2"><span class="text-yellow-400">${(rule.resources || ['*']).join(', ')}</span></td>
                                                <td class="p-2">${(rule.verbs || []).map(v => `<span class="px-1 py-0.5 rounded text-xs ${v === '*' ? 'bg-red-600' : 'bg-green-600/50'}">${v}</span>`).join(' ')}</td>

                                                <td class="p-2 text-white">${subj.name}</td>

                }

                structuredContent = structuredContent || resourceSpecHTML(resourceType, data);

                document.getElementById('modal-content').innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-slate-700 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-2">Metadata</h3>
                            <div class="grid grid-cols-2 gap-2 text-sm">
                                <div><span class="text-slate-400">Name:</span> ${data.metadata?.name || name}</div>
                                ${namespace ? `<div><span class="text-slate-400">Namespace:</span> ${data.metadata?.namespace || namespace}</div>` : ''}
                                <div><span class="text-slate-400">UID:</span> <span class="text-xs">${data.metadata?.uid || '-'}</span></div>
                                <div><span class="text-slate-400">Created:</span> ${data.metadata?.creationTimestamp || '-'}</div>
                            </div>
                        </div>
                        ${structuredContent}
                        ${data.metadata?.labels && Object.keys(data.metadata.labels).length > 0 ? `
                        <div class="bg-slate-700 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-2">Labels</h3>
                            <div class="flex flex-wrap gap-2">
                                ${Object.entries(data.metadata.labels).map(([k, v]) => `
                                    <span class="px-2 py-1 bg-slate-600 rounded text-xs">${k}: ${v}</span>
                                `).join('')}
                            </div>

                        ${data.metadata?.annotations && Object.keys(data.metadata.annotations).length > 0 ? `
                        <div class="bg-slate-700 rounded p-4">
                            <h3 class="text-sm font-semibold text-k8s-blue mb-2">Annotations</h3>
                            <div class="space-y-1 text-xs">
                                ${Object.entries(data.metadata.annotations).slice(0, 10).map(([k, v]) => `
                                    <div><span class="text-slate-400">${k}:</span> ${String(v).substring(0, 100)}${String(v).length > 100 ? '...' : ''}</div>
                                `).join('')}
                                ${Object.keys(data.metadata.annotations).length > 10 ? `<div class="text-slate-500">... and ${Object.keys(data.metadata.annotations).length - 10} more</div>` : ''}

                toast('Error loading details: ' + err.message);
